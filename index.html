                <a style="--i:4" class="fab-item" href="https://www.instagram.com/hochschule.offenburg/" target="_blank" aria-label="Instagram">

                </a>
              </nav>
            </div>
    </header>

    <div class="content-container">
        <div class="left-panel">
            <h2>Weihnachtsmusik:</h2>
            <button onclick="changeMusic('audio/christmas.mp3')">Musik 1</button>
            <button onclick="changeMusic('audio/jinglebells.mp3')">Musik 2</button>
        </div>

        <div class="center-panel">
            <div id="mainDoor" class="main-door">
                <span>🎁</span>
                <div class="door-text">Türchen öffnen</div>
            </div>
        </div>

        <div class="right-panel">
            <h2>Platz für Text</h2>
            <p>Hier kommt später ein Text.</p>
        </div>
    </div>

    <audio id="bg-music" src="audio/christmas.mp3" loop autoplay></audio>

    <script>
        function changeMusic(src) {
            const music = document.getElementById('bg-music');
            music.src = src;
            music.play();
        }

        document.getElementById('mainDoor').addEventListener('click', () => {
            alert('Türchen geöffnet!');
        });
    </script>
<script>
    const fab = document.querySelector('.social-fab');
    const toggle = fab?.querySelector('.fab-toggle');
    const menu = fab?.querySelector('.fab-menu');

    function setOpen(open) {
        fab.classList.toggle('open', open);
        toggle.setAttribute('aria-expanded', String(open));
        menu.setAttribute('aria-hidden', String(!open));
    }

    toggle?.addEventListener('click', () =>
        setOpen(!fab.classList.contains('open'))
    );

    document.addEventListener('click', (e) => {
        if (!fab.contains(e.target)) setOpen(false);
    });
</script>
